name: OpenDriver CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Core Tests & CLI Build
      run: |
        bash run.sh --test
        bash run.sh --build

    - name: Build Android Debug APK
      run: gradle :app:assembleDebug --stacktrace

    - name: Upload OpenDriver APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenDriver-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Core CLI Tool
      uses: actions/upload-artifact@v4
      with:
        name: opendriver-cli-jar
        path: build/opendriver-cli.jar
